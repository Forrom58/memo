<!DOCTYPE html>
<html lang="it" style="background:#121619">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121619">
<meta name="color-scheme" content="dark">
<title>Memo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --sfondo: #121619;
    --pannello: #1c2328;
    --bordo: #2c363d;
    --testo: #a9b4bb;
    --tenue: #6f7c85;
    --accento: #3f6f86;
    --rosso: #7a2e2e;
    --rosso-chiaro: #b05454;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--sfondo); color: var(--testo);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
  /* Intestazione: microfono, scritta e versione sulla stessa base (come Vault) */
  #titolo { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: calc(16px + env(safe-area-inset-top)) 16px 0; }
  #titolo h1 { font-size: 28px; margin: 0; display: flex; align-items: baseline; gap: 6px; line-height: 1; }
  #titolo h1 svg { width: 20px; height: 27px; flex-shrink: 0; position: relative; top: 1px; fill: #7fa8a3; }
  #versione { font-size: 15px; color: #7fa8a3; white-space: nowrap; }
  body.vista-elenco #titolo { display: none; }

  /* Schermata registrazione: tutto lo schermo è il pulsante */
  #area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px; touch-action: manipulation; }
  #cerchio { width: 140px; height: 140px; border-radius: 50%; background: var(--pannello);
    border: 3px solid var(--bordo); display: flex; align-items: center; justify-content: center; }
  #cerchio svg { width: 64px; height: 64px; fill: var(--tenue); }
  body.reg #cerchio { background: var(--rosso); border-color: var(--rosso-chiaro); animation: pulsa 1.4s infinite; }
  body.reg #cerchio svg { fill: #d9c4c4; }
  @keyframes pulsa { 50% { transform: scale(1.06); } }
  #stato { font-size: 26px; font-weight: 600; }
  #tempo { font-size: 22px; color: var(--tenue); min-height: 28px; font-variant-numeric: tabular-nums; }

  #barra { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--bordo); }
  button { font: inherit; color: var(--testo); background: var(--pannello); border: 1px solid var(--bordo);
    border-radius: 10px; padding: 12px 16px; font-size: 18px; }
  button:active { background: var(--bordo); }
  #btnElenco { width: 100%; }

  /* Schermata elenco */
  #elenco { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  body.vista-elenco #area, body.vista-elenco #barra { display: none; }
  body.vista-elenco #elenco { display: flex; }
  body.vista-elenco, body.vista-elenco #elenco { background: #08090a; }
  #testaElenco { display: flex; align-items: center; gap: 12px; padding: 24px 14px 10px; border-bottom: 1px solid var(--bordo); }
  #testaElenco h1 { font-size: 19px; margin: 0; flex: 1; }
  #btnIndietro { font-size: 15px; padding: 8px 12px; }
  #lista { flex: 1; overflow-y: auto; padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); }
  .memo { background: #27323a; border: none; border-radius: 10px; padding: 9px 12px;
    margin-bottom: 8px; }
  .memo .data { font-size: 16px; font-weight: 600; }
  .memo .durata { font-size: 13px; color: var(--tenue); margin-top: 2px; }
  .memo .comandi { display: flex; justify-content: space-between; margin-top: 4px; }
  /* Solo scritte cliccabili, senza pulsante dietro */
  .memo .comandi button { background: none; border: none; padding: 6px 0; font-size: 16px; font-weight: 700; }
  .memo .comandi button:active { background: none; opacity: .6; }
  .memo button.ascolta { color: #8fb3c2; }
  .memo button.elimina { color: #c27a7a; }
  .memo.suona { background: #31424d; }
  .memo button.calendario { color: #9fb39a; }
  .memo .suggerimento { font-size: 12px; color: var(--tenue); }
  /* Finestra scura per rinominare */
  #finestra { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 20;
    align-items: flex-start; justify-content: center; padding: 80px 16px 0; }
  #finestra.aperta { display: flex; }
  #finestra .box { background: #1c2328; border-radius: 10px; padding: 14px; width: 100%; max-width: 420px; }
  #finestra .box > div:first-child { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
  #nomeInput { width: 100%; font: inherit; font-size: 17px; color: var(--testo); background: #0e1113;
    border: 1px solid #3a4650; border-radius: 8px; padding: 9px 10px; outline: none; user-select: text; -webkit-user-select: text; }
  #finestra .azioni { display: flex; justify-content: space-between; margin-top: 10px; }
  #finestra .azioni button { background: none; border: none; padding: 6px 0; font-size: 16px; font-weight: 700; }
  #btnSalvaNome { color: #8fb3c2; }
  #btnAnnullaNome { color: var(--tenue); }
  #vuoto { text-align: center; color: var(--tenue); font-size: 17px; margin-top: 40px; }
</style>
</head>
<body>
<div id="titolo"><h1><svg viewBox="5 2 14 19" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>Memo</h1><span id="versione">v1.1.0</span></div>

<div id="area" role="button" aria-label="Tocca per registrare o fermare">
  <div id="cerchio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </div>
  <div id="stato">Tocca per registrare</div>
  <div id="tempo"></div>
</div>
<div id="barra"><button id="btnElenco">Ascolta i memo</button></div>

<div id="elenco">
  <div id="testaElenco">
    <button id="btnIndietro">Indietro</button>
    <h1>Memo salvati</h1>
  </div>
  <div id="lista"></div>
</div>

<div id="finestra">
  <div class="box">
    <div>Nome del memo</div>
    <input id="nomeInput" type="text" maxlength="60" autocomplete="off" enterkeyhint="done">
    <div class="azioni"><button id="btnAnnullaNome">Annulla</button><button id="btnSalvaNome">Salva</button></div>
  </div>
</div>

<script>
const VERSIONE = '1.1.0';
const DURATA_MAX = 5 * 60; // secondi: oltre questo tempo si ferma e salva da sola

/* ---------- Archivio (IndexedDB) ---------- */
let db;
function apriDB() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open('memo-db', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('memo', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => { db = r.result; ok(); };
    r.onerror = () => ko(r.error);
  });
}
function salvaMemo(m) {
  return new Promise((ok, ko) => {
    const t = db.transaction('memo', 'readwrite');
    t.objectStore('memo').add(m);
    t.oncomplete = ok; t.onerror = () => ko(t.error);
  });
}
function leggiMemo() {
  return new Promise((ok, ko) => {
    const r = db.transaction('memo').objectStore('memo').getAll();
    r.onsuccess = () => ok(r.result.reverse()); r.onerror = () => ko(r.error);
  });
}
function aggiornaMemo(m) {
  return new Promise((ok, ko) => {
    const t = db.transaction('memo', 'readwrite');
    t.objectStore('memo').put(m);
    t.oncomplete = ok; t.onerror = () => ko(t.error);
  });
}
function eliminaMemo(id) {
  return new Promise((ok, ko) => {
    const t = db.transaction('memo', 'readwrite');
    t.objectStore('memo').delete(id);
    t.oncomplete = ok; t.onerror = () => ko(t.error);
  });
}

/* ---------- Voce e vibrazione ---------- */
function vibra(schema) { try { navigator.vibrate && navigator.vibrate(schema); } catch (e) {} }
function parla(testo) {
  return new Promise(ok => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(testo);
      u.lang = 'it-IT'; u.rate = 1.05;
      let fatto = false;
      const fine = () => { if (!fatto) { fatto = true; ok(); } };
      u.onend = fine; u.onerror = fine;
      setTimeout(fine, 2500); // sicurezza se la voce non risponde
      speechSynthesis.speak(u);
    } catch (e) { ok(); }
  });
}
function durataParlata(s) {
  s = Math.round(s);
  if (s < 60) return s + (s === 1 ? ' secondo' : ' secondi');
  const m = Math.floor(s / 60), r = s % 60;
  return m + (m === 1 ? ' minuto' : ' minuti') + (r ? ' e ' + r + ' secondi' : '');
}
function durataScritta(s) {
  s = Math.round(s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* ---------- Registrazione ---------- */
const $ = id => document.getElementById(id);
let rec = null, pezzi = [], inizio = 0, timer = null, wakeLock = null, occupato = false;

async function avvia() {
  occupato = true;
  vibra(150);
  await parla('Registro');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    vibra([100, 80, 100, 80, 100]);
    $('stato').textContent = 'Microfono non disponibile';
    await parla('Microfono non disponibile. Controlla il permesso.');
    occupato = false; return;
  }
  const tipo = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
  rec = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
  pezzi = [];
  rec.ondataavailable = e => { if (e.data.size) pezzi.push(e.data); };
  rec.onstop = salvaFine;
  rec.start(1000);
  inizio = Date.now();
  document.body.classList.add('reg');
  $('stato').textContent = 'Registro… tocca per fermare';
  $('tempo').textContent = '0:00';
  timer = setInterval(() => {
    const s = (Date.now() - inizio) / 1000;
    $('tempo').textContent = durataScritta(s);
    if (s >= DURATA_MAX) ferma();
  }, 500);
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  occupato = false;
}

function ferma() {
  if (!rec || rec.state === 'inactive') return;
  occupato = true;
  clearInterval(timer);
  rec.stop();
  rec.stream.getTracks().forEach(t => t.stop());
}

async function salvaFine() {
  const secondi = (Date.now() - inizio) / 1000;
  const blob = new Blob(pezzi, { type: rec.mimeType || 'audio/webm' });
  rec = null;
  document.body.classList.remove('reg');
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  try {
    await salvaMemo({ data: Date.now(), secondi, audio: blob });
    vibra([200, 100, 200]);
    $('stato').textContent = 'Salvato';
    $('tempo').textContent = durataScritta(secondi);
    await parla('Salvato. ' + durataParlata(secondi));
  } catch (e) {
    vibra([100, 80, 100, 80, 100]);
    $('stato').textContent = 'Errore nel salvataggio';
    await parla('Errore nel salvataggio');
  }
  $('stato').textContent = 'Tocca per registrare';
  occupato = false;
  // Prova a chiudere l'app dopo il salvataggio (Android può ignorarlo)
  try { window.close(); } catch (e) {}
}

$('area').addEventListener('click', () => {
  if (occupato) return;
  if (rec && rec.state === 'recording') ferma(); else avvia();
});

/* ---------- Elenco e ascolto ---------- */
let player = null, urlCorrente = null, cardCorrente = null;

function fermaAscolto() {
  if (player) { player.pause(); player = null; }
  if (urlCorrente) { URL.revokeObjectURL(urlCorrente); urlCorrente = null; }
  if (cardCorrente) {
    cardCorrente.classList.remove('suona');
    cardCorrente.querySelector('.ascolta').textContent = 'Ascolta';
    cardCorrente = null;
  }
}

function formatoData(ms) {
  const d = new Date(ms);
  return d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }) +
    ', ore ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

async function mostraElenco() {
  fermaAscolto();
  document.body.classList.add('vista-elenco');
  const lista = $('lista');
  lista.innerHTML = '';
  const memo = await leggiMemo();
  if (!memo.length) { lista.innerHTML = '<div id="vuoto">Nessun memo salvato</div>'; return; }
  memo.forEach(m => {
    const card = document.createElement('div');
    card.className = 'memo';
    card.innerHTML = '<div class="data"></div><div class="durata"></div>' +
      '<div class="comandi"><button class="ascolta">Ascolta</button><button class="calendario">Calendario</button>' +
      '<button class="elimina">Elimina</button></div>';
    if (m.nome) {
      card.querySelector('.data').textContent = m.nome;
      card.querySelector('.durata').textContent = formatoData(m.data) + ' · ' + durataScritta(m.secondi);
    } else {
      card.querySelector('.data').textContent = formatoData(m.data);
      card.querySelector('.durata').textContent = 'Durata ' + durataScritta(m.secondi);
    }
    // Tocco lungo sul riquadro: rinomina
    let tLungo = null, x0 = 0, y0 = 0;
    card.addEventListener('pointerdown', e => {
      x0 = e.clientX; y0 = e.clientY;
      tLungo = setTimeout(() => { tLungo = null; card.dataset.lungo = '1'; setTimeout(() => delete card.dataset.lungo, 1000); vibra(60); apriRinomina(m); }, 600);
    });
    const annullaLungo = () => { if (tLungo) { clearTimeout(tLungo); tLungo = null; } };
    card.addEventListener('pointerup', annullaLungo);
    card.addEventListener('pointercancel', annullaLungo);
    card.addEventListener('pointermove', e => { if (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10) annullaLungo(); });
    card.addEventListener('contextmenu', e => e.preventDefault());
    // Dopo un tocco lungo non far scattare Ascolta/Calendario/Elimina
    card.addEventListener('click', e => { if (card.dataset.lungo) { e.stopPropagation(); e.preventDefault(); delete card.dataset.lungo; } }, true);
    card.querySelector('.calendario').onclick = () => apriCalendario(m);
    card.querySelector('.ascolta').onclick = () => {
      if (cardCorrente === card) { fermaAscolto(); return; }
      fermaAscolto();
      urlCorrente = URL.createObjectURL(m.audio);
      player = new Audio(urlCorrente);
      player.onended = fermaAscolto;
      player.play();
      cardCorrente = card;
      card.classList.add('suona');
      card.querySelector('.ascolta').textContent = 'Ferma';
    };
    card.querySelector('.elimina').onclick = async () => {
      if (!confirm('Eliminare questo memo?')) return;
      if (cardCorrente === card) fermaAscolto();
      await eliminaMemo(m.id);
      mostraElenco();
    };
    lista.appendChild(card);
  });
}

/* ---------- Rinomina ---------- */
let memoDaRinominare = null;
function apriRinomina(m) {
  memoDaRinominare = m;
  $('nomeInput').value = m.nome || '';
  $('finestra').classList.add('aperta');
  setTimeout(() => $('nomeInput').focus(), 50);
}
function chiudiRinomina() { $('finestra').classList.remove('aperta'); $('nomeInput').blur(); memoDaRinominare = null; }
async function salvaNome() {
  if (!memoDaRinominare) return;
  const nome = $('nomeInput').value.trim();
  if (nome) memoDaRinominare.nome = nome; else delete memoDaRinominare.nome; // vuoto = torna alla data
  await aggiornaMemo(memoDaRinominare);
  chiudiRinomina();
  mostraElenco();
}
$('btnSalvaNome').onclick = salvaNome;
$('btnAnnullaNome').onclick = chiudiRinomina;
$('nomeInput').addEventListener('keydown', e => { if (e.key === 'Enter') salvaNome(); });

/* ---------- Calendario ---------- */
// Apre l'app calendario con un nuovo evento già compilato (titolo = nome del memo).
// Se nessuna app risponde, apre Google Calendar nel browser.
function apriCalendario(m) {
  const titolo = m.nome || ('Memo del ' + formatoData(m.data));
  const nota = 'Dal memo vocale del ' + formatoData(m.data);
  const web = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' +
    encodeURIComponent(titolo) + '&details=' + encodeURIComponent(nota);
  const intent = 'intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.item/event;' +
    'S.title=' + encodeURIComponent(titolo) + ';S.description=' + encodeURIComponent(nota) +
    ';S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  location.href = /Android/i.test(navigator.userAgent) ? intent : web;
}

$('btnElenco').onclick = mostraElenco;
$('btnIndietro').onclick = () => { fermaAscolto(); document.body.classList.remove('vista-elenco'); };

/* ---------- Avvio ---------- */
$('versione').textContent = 'v' + VERSIONE;
apriDB();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
// Chiede all'archivio di non cancellare i memo per mancanza di spazio
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
</script>
</body>
</html>
